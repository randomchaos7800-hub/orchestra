[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Point it at your conversations. Get a knowledge base."
requires-python = ">=3.11"  # matches README.md — 3.11+ required
dependencies = [
    "openai>=2.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
orchestra-capture = "capture.extract:main"
orchestra-compile = "tools.compile:main"
orchestra-search  = "tools.search:main"
orchestra-query   = "tools.query:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
